# docker/docker-compose-e2e.yml
# Full local simulation: DSE Graph (source) → JanusGraph + HCD 2.x + OpenSearch (target)
#
# Prerequisites:
#   docker login cp.icr.io --username cp   (IBM entitlement key required for HCD image)
#   (Podman users: `podman login cp.icr.io --username cp`)
#
# Usage (Docker; for Podman substitute `podman compose` or `podman-compose`):
#   docker compose -f docker/docker-compose-e2e.yml up -d
#   docker compose -f docker/docker-compose-e2e.yml ps       # verify all healthy
#   docker compose -f docker/docker-compose-e2e.yml down -v  # full teardown
#
# HCD runs with password authentication enabled (docker/hcd-entrypoint.sh). Export the password of its built-in
# `cassandra` superuser first — on a fresh local stack it is `cassandra`:  export HCD_CQL_PASSWORD=cassandra

networks:
  migrator-net:

volumes:
  hcd-data:
  opensearch-data:
  dse-data:

services:

  # ── TARGET: HCD 2.x (DataStax Hyper-Converged Database) ─────────────────────────
  hcd:
    # Override the tag with HCD_IMAGE_TAG (e.g. HCD_IMAGE_TAG=2.0.9-ubi ./docker/up.sh); default 2.0.8-ubi.
    image: cp.icr.io/cp/ibm-hyper-converged-database/hcd:${HCD_IMAGE_TAG:-2.0.8-ubi}
    platform: linux/amd64           # HCD ships amd64 only; Rosetta emulation on Apple Silicon
    container_name: migrator-hcd
    networks: [migrator-net]
    mem_limit: 6G
    # Let it drain on stop/recreate: under emulation the default 10 s kills it mid-flush, and replaying the
    # commit log on the next start crashed DSE (exit 100, "incompatible schema").
    stop_grace_period: 2m
    environment:
      - QEMU_CPU=max                # Apple Silicon + QEMU: expose AVX2 (glibc x86-64-v3 check); ignored elsewhere
      - CASSANDRA_LIBJEMALLOC=-     # Apple Silicon + QEMU: the jemalloc LD_PRELOAD segfaults under emulation; harmless elsewhere
      - MAX_HEAP_SIZE=1536M
      - CLUSTER_NAME=hcd_cluster
      - DS_LICENSE=accept
      - JVM_EXTRA_OPTS=-Dcassandra.sai.latest.version=ec
      # A reference to the caller's environment, not a value (hence the allowlist pragma).
      - HCD_CQL_PASSWORD=${HCD_CQL_PASSWORD:?Set HCD_CQL_PASSWORD - on a fresh local stack export HCD_CQL_PASSWORD=cassandra}  # pragma: allowlist secret
    # The image ships with authentication disabled; this wrapper enables it, then runs the image's own entrypoint
    # (which still auto-configures the network settings).
    entrypoint: ["/tini", "-g", "--", "/hcd-entrypoint.sh"]
    command: ["hcd", "cassandra", "-f"]
    volumes:
      - ./hcd-entrypoint.sh:/hcd-entrypoint.sh:ro
      - hcd-data:/var/lib/cassandra
    ports:
      - "9042:9042"                 # CQL — JanusGraph connects here
      - "8181:8181"                 # HCD Data API
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p \"$$HCD_CQL_PASSWORD\" -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s             # HCD initialises slowly on first start

  # ── TARGET: OpenSearch 3 (index backend for JanusGraph) ─────────────────────
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: migrator-opensearch
    networks: [migrator-net]
    mem_limit: 1536M
    environment:
      - discovery.type=single-node
      # Security is disabled below, so no admin password is needed: skip the demo security config, which is
      # the only thing that requires OPENSEARCH_INITIAL_ADMIN_PASSWORD. Keeps credentials out of this file.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - plugins.security.disabled=true  # Disable security for local dev
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"                 # REST API — JanusGraph connects here
      - "9600:9600"                 # Performance analyser
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # ── TARGET: JanusGraph (graph engine over HCD + OpenSearch) ─────────────────
  janusgraph:
    image: janusgraph/janusgraph:latest
    container_name: migrator-janusgraph
    networks: [migrator-net]
    ports:
      - "8182:8182"                 # Gremlin WebSocket
    environment:
      JANUS_PROPS_TEMPLATE: cql-es
      # Storage — HCD 2.x
      janusgraph.storage.backend: cql
      janusgraph.storage.hostname: hcd
      janusgraph.storage.port: "9042"
      janusgraph.storage.cql.local-datacenter: dc1
      janusgraph.storage.username: cassandra
      janusgraph.storage.password: ${HCD_CQL_PASSWORD:?Set HCD_CQL_PASSWORD}
      janusgraph.storage.cql.keyspace: jg_migration_test
      janusgraph.storage.cql.replication-strategy-class: NetworkTopologyStrategy
      janusgraph.storage.cql.replication-strategy-options: dc1,1
      # HCD guardrail: do NOT use atomic batch mutations
      janusgraph.storage.cql.atomic-batch-mutate: "false"
      # Index — OpenSearch (elasticsearch driver is wire-compatible)
      janusgraph.index.search.backend: elasticsearch
      janusgraph.index.search.hostname: opensearch
      janusgraph.index.search.port: "9200"
      janusgraph.index.search.index-name: jg_migration_test
      # Schema
      janusgraph.schema.default: none
    depends_on:
      hcd:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/gremlin.sh", "-e", "scripts/remote-connect.groovy"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 30s

  # ── SOURCE: DSE Graph 6.9 (DSG/Core source for migration testing) ───────────
  # 6.9 (Java 11) instead of 6.8 (Java 8): the 6.8 JVM wedged at a safepoint on every boot under QEMU
  # emulation on Apple Silicon. On a native amd64 host, datastax/dse-server:6.8.65-ubi7 works here too.
  dse-graph-source:
    image: datastax/dse-server:6.9.26-ubi
    container_name: migrator-dse-source
    networks: [migrator-net]
    # Let it drain on stop/recreate: under emulation the default 10 s kills it mid-flush, and replaying the
    # commit log on the next start crashed DSE (exit 100, "incompatible schema").
    stop_grace_period: 2m
    mem_limit: 6G                   # 2G and 4G were OOM-killed under emulation (heap + off-heap + DSE Graph)
    cpus: 8                         # needs a VM with > 8 CPUs (podman machine set --cpus 10); bounded to leave headroom
    # `-g` = Graph workload on top of core Cassandra (env DSE_GRAPH is ignored by this image);
    # `-s` = DSE Search, needed by searchIndex() (food/enterprise templates, E2E). `["-g"]` suffices for social/iot.
    command: ["-g", "-s"]
    environment:
      DS_LICENSE: accept
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 400M
    volumes:
      - dse-data:/var/lib/cassandra
    ports:
      - "9043:9042"               # DSE CQL (offset to avoid clash with HCD on 9042)
      - "8183:8182"               # DSE Gremlin WebSocket
    healthcheck:
      # `nodetool status` reports UN before CQL is listening (observed under QEMU), so probe CQL itself.
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s           # DSE takes longer than HCD to initialise

  # ── OPTIONAL: JanusGraph Visualizer (graph exploration UI) ──────────────────
  janusgraph-visualizer:
    image: janusgraph/janusgraph-visualizer:latest
    container_name: migrator-visualizer
    networks: [migrator-net]
    ports:
      - "3000:3000"               # UI
      - "3001:3001"               # Gremlin proxy
    environment:
      - GREMLIN_HOST=migrator-janusgraph
    depends_on:
      janusgraph:
        condition: service_healthy
