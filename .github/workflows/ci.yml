name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "dse-jg-migrator/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "dse-jg-migrator/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: dse-jg-migrator

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dse-jg-migrator/pyproject.toml

      - name: Install ruff
        run: pip install ruff

      - name: ruff check (E, F, I, N, UP, S)
        run: ruff check dse_jg_migrator/ tests/

      - name: ruff format --check
        run: ruff format --check dse_jg_migrator/ tests/

  typecheck:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dse-jg-migrator/pyproject.toml

      - name: Install build tools + package + mypy
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install mypy

      - name: mypy --strict
        run: mypy dse_jg_migrator/ --strict

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dse-jg-migrator/pyproject.toml

      - name: Install build tools + package + test dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e . pytest pytest-cov

      - name: pytest (unit tests, coverage ≥ 60%)
        run: |
          pytest tests/unit/ -v \
            --cov=dse_jg_migrator \
            --cov-report=term-missing \
            --cov-fail-under=60

  audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dse-jg-migrator/pyproject.toml

      - name: Install build tools + package + pip-audit
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e . pip-audit

      - name: pip-audit (no known vulnerabilities)
        run: pip-audit --local
